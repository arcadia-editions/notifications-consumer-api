asyncapi: 3.0.0
id: urn:com.arcadiaeditions:notifications:consumer:asyncapi:client

info:
  title: Arcadia Editions - Notifications Consumer - AsyncAPI Client
  version: 0.1.0
  description: Consumed AsyncAPI channels for Arcadia Editions - Notifications Consumer.

x-application-bindings:
  x-principal: notifications_consumer
  x-clientId: notifications_consumer
  x-groupId: notifications_consumer

channels:
  payment-captured-event-v1:
    $ref: https://raw.githubusercontent.com/arcadia-editions/payments-processing-api/main/asyncapi.yml#/channels/payment-captured-event-v1
  stock-unavailable-event-v1:
    $ref: https://raw.githubusercontent.com/arcadia-editions/orders-checkout-api/main/asyncapi.yml#/channels/stock-unavailable-event-v1
  order-cancelled-event-v1:
    $ref: https://raw.githubusercontent.com/arcadia-editions/orders-checkout-api/main/asyncapi.yml#/channels/order-cancelled-event-v1

operations:
  onPaymentCapturedEventV1:
    action: receive
    channel:
      $ref: "#/channels/payment-captured-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onStockUnavailableEventV1:
    action: receive
    channel:
      $ref: "#/channels/stock-unavailable-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"
  onOrderCancelledEventV1:
    action: receive
    channel:
      $ref: "#/channels/order-cancelled-event-v1"
    traits:
    - $ref: "#/components/operationTraits/clientIdAndPrincipal"

components:
  messageTraits:
    CommonHeaders:
      $ref: https://raw.githubusercontent.com/arcadia-editions/api-contract-commons/refs/heads/main/asyncapi-message-traits.yml#/components/messageTraits/CommonHeaders
  operationTraits:
    clientIdAndPrincipal:
      bindings:
        kafka:
          x-principal:
            $ref: "#/x-application-bindings/x-principal"
          x-groupId:
            $ref: "#/x-application-bindings/x-groupId"
